[build]
  publish = "public"

# Enable pretty URLs (removes .html extension)
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

# Security headers (all pages)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # SQUIRE booking widget (loaded on /book only) needs its host allowed here.
    # Netlify applies every matching [[headers]] rule, so a second /book-scoped
    # CSP would be intersected by the browser and still block the widget --
    # hence the single site-wide policy. Hosts unreferenced by a page have no
    # effect on it, so other pages are unchanged in practice.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://widget.getsquire.com https://*.getsquire.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://*.getsquire.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com https://*.getsquire.com; img-src 'self' data: https:; frame-src https://www.google.com https://*.getsquire.com; connect-src 'self' https://*.getsquire.com"

# Cache static assets (1 year)
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache HTML pages (1 hour, revalidate)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Redirect trailing slashes for cleaner URLs
[[redirects]]
  from = "/*/"
  to = "/:splat"
  status = 301

# Redirect .html URLs to clean URLs (301 for SEO)
[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301

[[redirects]]
  from = "/blog.html"
  to = "/blog"
  status = 301

[[redirects]]
  from = "/cranial-prosthesis.html"
  to = "/cranial-prosthesis"
  status = 301

[[redirects]]
  from = "/services.html"
  to = "/services"
  status = 301

[[redirects]]
  from = "/blog/*.html"
  to = "/blog/:splat"
  status = 301

[[redirects]]
  from = "/book.html"
  to = "/book"
  status = 301

# Likely guess-type for the booking page. /book/ -> /book is already covered
# by the trailing-slash rule above, so no rule is added for it -- adding one
# would fight that rule and loop.
[[redirects]]
  from = "/booking"
  to = "/book"
  status = 301
