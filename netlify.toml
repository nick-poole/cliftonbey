[build]
  publish = "public"

# Enable pretty URLs (removes .html extension)
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

# Non-production deploys (Deploy Previews, branch deploys) must never be indexed.
# The site has no build step, so the only work here is flipping the robots meta
# in the published HTML. Production defines no command and ships the files as-is.
[context.deploy-preview]
  command = 'find public -name "*.html" -exec sed -i "s/name=\"robots\" content=\"index, follow\"/name=\"robots\" content=\"noindex, nofollow\"/g" {} +'

[context.branch-deploy]
  command = 'find public -name "*.html" -exec sed -i "s/name=\"robots\" content=\"index, follow\"/name=\"robots\" content=\"noindex, nofollow\"/g" {} +'

# Security headers (all pages)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # /book loads SQUIRE's widget scripts (widget.getsquire.com) which frame
    # the booking dialog from the getsquire.com APEX. A *.getsquire.com
    # wildcard does NOT match the apex (wildcards cover subdomains only) --
    # verified the hard way on deploy preview 25 -- so the apex must stay
    # listed explicitly in frame-src. connect-src covers the widget's
    # page-context lookups (api.getsquire.com); everything the framed app
    # loads internally is governed by SQUIRE's own CSP, not this one.
    # Netlify applies every matching [[headers]] rule and browsers intersect
    # duplicate CSP headers, so this stays a single site-wide policy rather
    # than a /book-scoped one; hosts unreferenced by a page have no effect.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://widget.getsquire.com https://*.getsquire.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; frame-src https://www.google.com https://getsquire.com https://*.getsquire.com; connect-src 'self' https://getsquire.com https://*.getsquire.com"

# Cache static assets (1 year)
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache HTML pages (1 hour, revalidate)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Redirect trailing slashes for cleaner URLs
[[redirects]]
  from = "/*/"
  to = "/:splat"
  status = 301

# Redirect .html URLs to clean URLs (301 for SEO)
[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301

[[redirects]]
  from = "/blog.html"
  to = "/blog"
  status = 301

[[redirects]]
  from = "/cranial-prosthesis.html"
  to = "/cranial-prosthesis"
  status = 301

[[redirects]]
  from = "/services.html"
  to = "/services"
  status = 301

[[redirects]]
  from = "/blog/*.html"
  to = "/blog/:splat"
  status = 301

[[redirects]]
  from = "/book.html"
  to = "/book"
  status = 301

# Likely guess-type for the booking page. /book/ -> /book is already covered
# by the trailing-slash rule above, so no rule is added for it -- adding one
# would fight that rule and loop.
[[redirects]]
  from = "/booking"
  to = "/book"
  status = 301
